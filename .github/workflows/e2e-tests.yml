name: E2E Tests

on:
  workflow_call:  # Called by release workflow
  workflow_dispatch:  # Allow manual triggering

concurrency:
  group: ${{ github.workflow || 'E2E Tests' }}-${{ github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  # contents: read, not write. The github/gitea matrix cells create tags in the separate
  # TEST repositories over the API with TEST_GITHUB_TOKEN / TEST_GITEA_TOKEN, and the
  # git/generic cells run with push-tag: false, so nothing here writes to THIS repository.
  #
  # It also cannot be `write` any more: release.yml now runs on a `contents: read` floor
  # (R8), and a called reusable workflow may not request more than its caller was granted
  # -- leaving `write` here makes the Release run fail at startup in 1s with no logs,
  # which is what happened to git-action-release v2.0.5.
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      # Common tag prefix (matrix can override)
      TEST_TAG_PREFIX: ${{ matrix.tagPrefix || 'test-' }}
      # GitHub
      TEST_GITHUB_REPOSITORY: ${{ matrix.githubRepo || secrets.TEST_GITHUB_REPOSITORY || github.repository }}
      # No fallback to secrets.GITHUB_TOKEN: it is never empty, so it made the
      # "token missing -> skip" guard below unreachable, and it cannot write to the
      # external test repository, so the job failed with 401 instead of skipping.
      TEST_GITHUB_TOKEN: ${{ secrets.TEST_GITHUB_TOKEN || '' }}
      # Gitea
      TEST_GITEA_REPOSITORY: ${{ matrix.giteaRepo || secrets.TEST_GITEA_REPOSITORY || '' }}
      TEST_GITEA_TOKEN: ${{ secrets.TEST_GITEA_TOKEN || '' }}
      TEST_GITEA_BASE_URL: ${{ matrix.giteaBaseUrl || '' }}
      # Bitbucket. The matrix cell is commented out below, so matrix.bitbucketRepo and
      # matrix.bitbucketBaseUrl do not exist -- referencing them yielded '' at runtime but
      # is an undefined-property error to actionlint, which only started reading this file
      # when the lint step stopped being pinned to ci.yml. Restore the `matrix.bitbucket*
      # ||` halves together with the matrix cell.
      TEST_BITBUCKET_REPOSITORY: ${{ secrets.TEST_BITBUCKET_REPOSITORY || '' }}
      TEST_BITBUCKET_TOKEN: ${{ secrets.TEST_BITBUCKET_TOKEN || '' }}
      TEST_BITBUCKET_BASE_URL: ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: github
            testPattern: github.e2e
            githubRepo: LiquidLogicLabs/git-action-release-tests
            tagPrefix: test-
          - platform: gitea
            testPattern: gitea.e2e
            giteaBaseUrl: https://git.ravenwolf.org
            giteaRepo: liquidlogiclabs/git-action-release-tests
            tagPrefix: test-
          # - platform: bitbucket
          #   testPattern: bitbucket.e2e
          #   bitbucketBaseUrl: https://bitbucket.org
          #   bitbucketRepo: owner/repo
          #   tagPrefix: test-
          - platform: generic
            testPattern: generic.e2e
            tagPrefix: test-
          - platform: git
            testPattern: generic.e2e
            tagPrefix: test-

    environment: TEST

    permissions:
      contents: read
      actions: read
    # Run action from committed dist only (no build). Ensures E2E fails if dist is unbundled.
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # No step in this job pushes to this repository: the github/gitea cells write
          # to the separate TEST repositories with their own tokens, and the git/generic
          # cells create a local tag with push-tag: false.
          persist-credentials: false

      - name: Prepare tag metadata
        id: prep
        env:
          Z_MATRIX_TAGPREFIX_TEST: ${{ matrix.tagPrefix || 'test-' }}
          Z_MATRIX_PLATFORM: ${{ matrix.platform }}
        run: |
          TAG_NAME="${Z_MATRIX_TAGPREFIX_TEST}$(date +%s)-${GITHUB_SHA:0:7}-${Z_MATRIX_PLATFORM}"
          echo "tag-name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Resolve platform inputs
        id: resolve
        env:
          Z_MATRIX_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          run="true"
          repo=""
          token=""
          base_url=""
          push_tag="true"
          case "${Z_MATRIX_PLATFORM}" in
            github)
              repo="${TEST_GITHUB_REPOSITORY}"
              token="${TEST_GITHUB_TOKEN}"
              push_tag="true"
              if [ -z "$repo" ] || [ -z "$token" ]; then
                echo "⚠️ Skipping GitHub E2E: repo or token missing"
                run="false"
              fi
              ;;
            gitea)
              repo="${TEST_GITEA_REPOSITORY}"
              token="${TEST_GITEA_TOKEN}"
              base_url="${TEST_GITEA_BASE_URL}"
              push_tag="true"
              if [ -z "$repo" ] || [ -z "$token" ]; then
                echo "⚠️ Skipping Gitea E2E: repo or token missing"
                run="false"
              fi
              ;;
            bitbucket)
              repo="${TEST_BITBUCKET_REPOSITORY}"
              token="${TEST_BITBUCKET_TOKEN}"
              base_url="${TEST_BITBUCKET_BASE_URL}"
              push_tag="true"
              if [ -z "$repo" ] || [ -z "$token" ]; then
                echo "⚠️ Skipping Bitbucket E2E: repo or token missing"
                run="false"
              fi
              ;;
            generic|git)
              push_tag="false"
              run="true"
              ;;
          esac
          {
            echo "run=$run"
            echo "repo=$repo"
            echo "token=$token"
            echo "base_url=$base_url"
            echo "push_tag=$push_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Configure Git user (for git/generic platform)
        if: steps.resolve.outputs.run == 'true' && (matrix.platform == 'git' || matrix.platform == 'generic')
        run: |
          # Configure git user for annotated tags (required by Git)
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          echo "✅ Configured git user for local Git operations"

      - name: Run E2E via action (${{ matrix.platform }})
        if: steps.resolve.outputs.run == 'true'
        uses: ./  # zizmor: ignore[self-repository] — local ACTION reference under test, not a reusable-workflow call; $/ does not apply
        with:
          tag-name: ${{ steps.prep.outputs.tag-name }}
          tag-message: E2E ${{ matrix.platform }} tag ${{ steps.prep.outputs.tag-name }}
          repository: ${{ steps.resolve.outputs.repo }}
          token: ${{ steps.resolve.outputs.token }}
          base-url: ${{ steps.resolve.outputs.base_url }}
          repo-type: ${{ matrix.platform }}
          force: true
          update-existing: false
          push-tag: ${{ steps.resolve.outputs.push_tag }}
          verbose: true
